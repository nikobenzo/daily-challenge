<!doctype html>
<html lang="en-GB"><meta charset="utf-8"><title>Daily Challenge · App Store</title>
<style>
* { box-sizing: border-box; } html,body { margin:0; width:__WIDTH__px; height:__HEIGHT__px; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
.canvas { width:1320px; height:__CANVAS_HEIGHT__px; transform:scale(__SCALE__); transform-origin:top left; position:relative; overflow:hidden; color:#0f172a; background:radial-gradient(ellipse at 92% 85%,#c6dcff 0,transparent 48%),radial-gradient(ellipse at 8% 8%,#fff 0,transparent 45%),#f6f8fd; }
.canvas.blue { color:#fff; background:radial-gradient(ellipse at 95% 82%,#5ea8ff 0,transparent 60%),linear-gradient(155deg,#1f56e0,#0b2a8a); }
.canvas.dark { color:#fff; background:radial-gradient(ellipse at 92% 78%,#303c91 0,transparent 58%),#080c2b; }
.halo { position:absolute; left:560px; top:1390px; width:1100px; height:1100px; border:2px solid #2e66f018; border-radius:50%; }
.halo:after { content:""; position:absolute; inset:100px; border:2px solid #2e66f018; border-radius:50%; }
.blue .halo,.dark .halo,.blue .halo:after,.dark .halo:after { border-color:#ffffff12; }
.brand { position:absolute; left:100px; top:92px; display:flex; gap:20px; align-items:center; font-size:32px; font-weight:700; letter-spacing:-.4px; }
.brand img { width:62px; height:62px; border-radius:16px; }
.copy { position:absolute; left:100px; right:84px; top:240px; }
.tag { font-size:25px; font-weight:750; letter-spacing:3px; color:#1f56e0; margin-bottom:28px; }
.blue .tag,.dark .tag { color:#8cc4ff; }
h1 { font-size:106px; line-height:1.03; letter-spacing:-4px; font-weight:850; margin:0; }
h1 span { display:block; white-space:nowrap; }
h1 span:last-child { color:#1f56e0; }
.blue h1 span:last-child { color:#fff; }
.dark h1 span:last-child { color:#8cc4ff; }
.detail { font-size:35px; font-weight:500; letter-spacing:-.5px; line-height:1.3; color:#5b6478; margin:32px 0 0; white-space:nowrap; }
.blue .detail,.dark .detail { color:#c9cff5; }
.phone { position:absolute; top:755px; left:190px; width:940px; padding:14px; background:linear-gradient(110deg,#64718b,#0f172a 20%,#080b13 80%,#6e7890); border-radius:112px; box-shadow:0 40px 100px #1e285a38,0 4px 8px #080a2840; }
.phone img { display:block; width:912px; height:auto; border-radius:98px; }
.island { position:absolute; left:calc(50% - 103px); top:34px; width:206px; height:58px; border-radius:38px; background:#050608; }
.phone.water,.phone.extras { width:820px; left:250px; top:760px; opacity:.93; }
.phone.water img,.phone.extras img { width:792px; }
.zoom { position:absolute; left:90px; width:1140px; overflow:hidden; border:3px solid #fff; border-radius:54px; box-shadow:0 24px 80px #1e285a30; background:#f6f8fd; }
.zoom img { position:absolute; width:__ZOOM_WIDTH__px; left:__ZOOM_LEFT__px; top:__ZOOM_TOP__px; max-width:none; }
.zoom.water { top:1500px; height:670px; }
.zoom.extras { top:1530px; height:700px; }
.zoom-note { position:absolute; left:100px; top:2550px; font-size:31px; color:#5b6478; font-weight:600; }
.footer { position:absolute; bottom:48px; left:100px; right:100px; display:flex; justify-content:space-between; font-size:22px; color:#5b6478; letter-spacing:1px; }
.blue .footer,.dark .footer { color:#c9cff5; }
</style>
<div class="canvas __THEME__">
<div class="halo"></div>
<div class="brand"><img src="__ICON__" alt="">Daily Challenge</div>
<div class="copy"><div class="tag">__TAG__</div><h1>__HEADLINE__</h1><p class="detail">__DETAIL__</p></div>
<div class="phone __LAYOUT__"><img src="__SOURCE__" alt="Daily Challenge fixture capture"><div class="island"></div></div>
__ZOOM__
<div class="footer"><span>DAILY CHALLENGE</span><span>__NUMBER__ / 07</span></div>
</div></html>
