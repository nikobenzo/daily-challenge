<!doctype html>
<html lang="en-GB"><meta charset="utf-8"><title>Daily Challenge Tracker | Header</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; width:__WIDTH__px; height:__HEIGHT__px; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; }
.canvas { position:relative; width:100%; height:100%; overflow:hidden; color:#0f172a;
 background:radial-gradient(ellipse at 80% 65%,#c6dcff 0,transparent 48%),radial-gradient(ellipse at 15% 20%,#fff 0,transparent 50%),#f6f8fd; }
.safe { position:absolute; left:__SAFE_X__px; top:__SAFE_Y__px; width:__SAFE_W__px; height:__SAFE_H__px; }
.core { position:absolute; inset:58px; display:flex; align-items:center; justify-content:space-between; gap:50px; }
.copy { width:790px; flex-shrink:0; }
.brand { display:flex; align-items:center; gap:18px; font-size:34px; font-weight:700; letter-spacing:-.6px; margin-bottom:50px; }
.brand img { width:64px; height:64px; border-radius:17px; }
.tag { color:#1f56e0; font-size:24px; font-weight:750; letter-spacing:3px; margin-bottom:24px; }
h1 { font-size:132px; font-weight:850; line-height:1.02; letter-spacing:-5px; margin:0; }
h1 span { display:block; white-space:nowrap; }
h1 span:last-child { color:#1f56e0; }
.today-wrap { flex-shrink:0; width:__TODAY_W__px; }
.today { position:relative; overflow:hidden; width:__TODAY_W__px; height:__TODAY_H__px; border-radius:42px; box-shadow:0 30px 70px #1e285a26; }
.today img { position:absolute; width:__SOURCE_W__px; left:__SOURCE_X__px; top:__SOURCE_Y__px; max-width:none; }
.caption { color:#5b6478; font-size:24px; font-weight:600; margin:22px 0 0; text-align:center; }
.widget-phone { position:absolute; left:calc(__SAFE_X__px + __SAFE_W__px + 170px); top:220px; width:540px; padding:10px; border-radius:70px;
 background:linear-gradient(110deg,#64718b,#0f172a 20%,#080b13 80%,#6e7890); box-shadow:0 40px 100px #1e285a38; transform:rotate(8deg); }
.widget-phone img { display:block; width:100%; border-radius:60px; }
.island { position:absolute; top:24px; left:calc(50% - 59px); width:118px; height:34px; border-radius:30px; background:#050608; }
.brand-texture { position:absolute; left:350px; top:560px; width:460px; height:460px; border-radius:110px; transform:rotate(-10deg); box-shadow:0 45px 100px #1e285a1a; opacity:.88; }
.halo { position:absolute; left:-500px; top:-400px; width:1900px; height:1900px; border:3px solid #2e66f00c; border-radius:50%; }
.halo:after { content:""; position:absolute; inset:160px; border:3px solid #2e66f00c; border-radius:50%; }
.universal .core { inset:60px 50px; gap:40px; }
.universal .copy { width:640px; }
.universal h1 { font-size:112px; letter-spacing:-4px; }
.universal .brand { font-size:30px; gap:14px; }
.universal .brand img { width:56px; height:56px; border-radius:15px; }
.universal .widget-phone { top:440px; width:720px; border-radius:90px; padding:12px; }
.universal .widget-phone img { border-radius:78px; }
.universal .island { width:158px; height:44px; left:calc(50% - 79px); top:30px; }
.universal .brand-texture { left:1140px; top:850px; width:520px; height:520px; border-radius:124px; }
.universal .halo { left:200px; top:-700px; width:2900px; height:2900px; }
</style>
<div class="canvas __LAYOUT__">
 <div class="halo"></div>
 <img class="brand-texture" src="__ICON__" alt="">
 <div class="widget-phone"><img src="__WIDGETS__" alt="Real placed Home Screen widgets"><div class="island"></div></div>
 <div class="safe"><div class="core">
  <div class="copy">
   <div class="brand" data-key><img src="__ICON__" alt="">__BRAND__</div>
   <div class="tag" data-key>__TAG__</div>
   <h1 data-key>__HEADLINE__</h1>
  </div>
  <div class="today-wrap" data-key><div class="today"><img src="__TODAY__" alt="Real Today capture: goals, water progress and logging controls"></div><p class="caption">Your day, at a glance.</p></div>
 </div></div>
</div></html>
